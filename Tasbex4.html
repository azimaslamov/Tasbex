<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tasbeh</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:'Poppins',sans-serif;
    background:#081317;
    color:white;
    overflow-x:hidden;
}

:root{
    --bg:#081317;
    --card:#112027;
    --card2:#18313b;
    --accent:#27d7a0;
    --accent2:#1aa97d;
    --text:#ffffff;
    --muted:#90a3aa;
}

.hidden{
    display:none !important;
}

.app{
    min-height:100vh;
    padding:18px;
}

/* TOPBAR */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.menu-btn{
    width:52px;
    height:52px;
    border:none;
    border-radius:18px;
    background:rgba(255,255,255,.05);
    color:white;
    font-size:24px;
}

.logo{
    font-size:28px;
    font-weight:700;
}

.total-box{
    background:rgba(255,255,255,.05);
    padding:10px 14px;
    border-radius:18px;
    text-align:right;
}

.total-box small{
    color:var(--muted);
}

/* SEARCH */

.search-box{
    margin-bottom:18px;
}

.search-box input{
    width:100%;
    height:58px;
    border:none;
    outline:none;
    border-radius:18px;
    background:#13252d;
    color:white;
    padding:0 18px;
    font-size:16px;
}

/* TITLE */

.section-title{
    margin-bottom:16px;
    color:#d7e2e6;
}

/* GRID */

.zikr-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

/* CARD */

.card{
    background:linear-gradient(145deg,var(--card),var(--card2));
    border-radius:26px;
    padding:18px;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.04);
    animation:fadeUp .35s ease;
    transition:.18s;
}

.card:active{
    transform:scale(.96);
}

.card::before{
    content:'';
    position:absolute;
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(255,255,255,.03);
    top:-35px;
    right:-35px;
}

.card-icon{
    font-size:28px;
    margin-bottom:10px;
}

.card h3{
    font-size:16px;
    line-height:1.4;
    margin-bottom:8px;
}

.card .translation{
    font-size:12px;
    color:#9fb2b8;
    margin-bottom:12px;
    line-height:1.5;
}

.card p{
    font-size:12px;
    color:var(--muted);
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    top:0;
    left:-300px;
    width:280px;
    height:100%;
    background:#0f1f26;
    z-index:999;
    padding:22px;
    transition:.35s;
}

.sidebar.active{
    left:0;
}

.sidebar-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
}

.close-btn{
    border:none;
    background:none;
    color:white;
    font-size:26px;
}

.menu-item{
    width:100%;
    border:none;
    background:#163039;
    color:white;
    padding:16px;
    border-radius:18px;
    margin-bottom:14px;
    text-align:left;
    font-size:15px;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:998;
    opacity:0;
    pointer-events:none;
    transition:.3s;
}

.overlay.active{
    opacity:1;
    pointer-events:auto;
}

/* ADD PAGE */

.add-page{
    min-height:100vh;
    padding:22px;
}

.add-page h2{
    margin-bottom:24px;
    font-size:30px;
}

.add-page input{
    width:100%;
    height:58px;
    border:none;
    outline:none;
    border-radius:18px;
    background:#13252d;
    color:white;
    padding:0 18px;
    margin-bottom:16px;
    font-size:15px;
}

.save-btn{
    width:100%;
    height:58px;
    border:none;
    border-radius:20px;
    background:linear-gradient(145deg,var(--accent),var(--accent2));
    color:white;
    font-size:17px;
    font-weight:600;
}

/* ZIKR PAGE */

.zikr-page{
    min-height:100vh;
    padding:22px;
    background:radial-gradient(circle at top,#112028,#081317);
}

.back-btn{
    width:52px;
    height:52px;
    border:none;
    border-radius:18px;
    background:rgba(255,255,255,.06);
    color:white;
    font-size:20px;
    margin-bottom:24px;
}

.zikr-name{
    font-size:32px;
    line-height:1.4;
    font-weight:700;
    margin-bottom:8px;
}

.zikr-translation{
    color:#9db0b7;
    line-height:1.6;
    font-size:15px;
}

/* COUNTER */

.counter{
    text-align:center;
    font-size:95px;
    font-weight:700;
    color:var(--accent);
    margin-top:30px;
    animation:pop .2s;
}

/* BUTTON */

.circle-wrap{
    display:flex;
    justify-content:center;
    margin-top:24px;
}

.circle-btn{
    width:260px;
    height:260px;
    border:none;
    border-radius:50%;
    background:linear-gradient(145deg,#29e5ad,#178a69);
    color:white;
    font-size:30px;
    font-weight:700;
    transition:.12s;
    box-shadow:
    0 0 20px rgba(39,215,160,.25),
    0 0 50px rgba(39,215,160,.12);
}

.circle-btn:active{
    transform:scale(.95);
}

/* STATS */

.stats-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:34px;
}

.stat{
    background:rgba(255,255,255,.05);
    border-radius:22px;
    padding:18px;
}

.stat small{
    color:var(--muted);
    display:block;
    margin-bottom:8px;
}

.stat strong{
    font-size:20px;
}

/* STATISTICS PAGE */

.stats-page{
    min-height:100vh;
    padding:22px;
}

.stats-card{
    background:linear-gradient(145deg,var(--card),var(--card2));
    padding:20px;
    border-radius:24px;
    margin-bottom:16px;
}

.stats-card h3{
    margin-bottom:8px;
}

.stats-card p{
    color:#9db0b7;
    line-height:1.7;
}

/* FAVORITE PAGE */

.favorite-page{
    min-height:100vh;
    padding:22px;
}

/* ANIMATIONS */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes pop{
    from{
        transform:scale(.85);
    }
    to{
        transform:scale(1);
    }
}

@media(max-width:480px){

    .zikr-grid{
        grid-template-columns:1fr;
    }

    .circle-btn{
        width:230px;
        height:230px;
    }

    .counter{
        font-size:78px;
    }

}

</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

    <div class="sidebar-top">
        <h2>⚙ Menu</h2>
        <button class="close-btn" onclick="closeMenu()">✕</button>
    </div>

    <button class="menu-item" onclick="openStatsPage()">
        📊 Statistikalar
    </button>

    <button class="menu-item" onclick="openFavoritePage()">
        ⭐ Favorite Zikrlar
    </button>

    <button class="menu-item" onclick="toggleDarkMode()">
        🌙 Dark Mode
    </button>

    <button class="menu-item" onclick="openAddPage()">
        ➕ Zikr qoʻshish
    </button>

</div>

<!-- HOME PAGE -->

<div class="app" id="homePage">

    <div class="topbar">

        <button class="menu-btn" onclick="openMenu()">
            ☰
        </button>

        <div class="logo">
            Tasbeh
        </div>

        <div class="total-box">
            <small>Jami</small><br>
            <strong id="allTotal">0</strong>
        </div>

    </div>

    <div class="search-box">
        <input type="text" placeholder="Qidirish..." onkeyup="searchZikr(this.value)">
    </div>

    <div class="section-title">
        Zikrlar
    </div>

    <div class="zikr-grid" id="zikrGrid"></div>

</div>

<!-- ZIKR PAGE -->

<div class="zikr-page hidden" id="zikrPage">

    <button class="back-btn" onclick="goHome()">←</button>

    <div class="zikr-name" id="pageTitle"></div>

    <div class="zikr-translation" id="pageTranslation"></div>

    <div class="counter" id="counterText">0</div>

    <div class="circle-wrap">

        <button class="circle-btn" onclick="incrementZikr()">
            TASBEH
        </button>

    </div>

    <div class="stats-box">

        <div class="stat">
            <small>Bugungi</small>
            <strong id="todayCount">0</strong>
        </div>

        <div class="stat">
            <small>Umumiy</small>
            <strong id="totalCount">0</strong>
        </div>

        <div class="stat">
            <small>Oxirgi vaqt</small>
            <strong id="lastTime">-</strong>
        </div>

        <div class="stat">
            <small>Eng koʻp</small>
            <strong id="bestZikr">-</strong>
        </div>

    </div>

</div>

<!-- ADD PAGE -->

<div class="add-page hidden" id="addPage">

    <button class="back-btn" onclick="goHome()">←</button>

    <h2>Yangi Zikr</h2>

    <input type="text" id="newZikrName" placeholder="Zikr nomi">

    <input type="text" id="newZikrTranslation" placeholder="Tarjimasi">

    <button class="save-btn" onclick="saveNewZikr()">
        Saqlash
    </button>

</div>

<!-- STATS PAGE -->

<div class="stats-page hidden" id="statsPage">

    <button class="back-btn" onclick="goHome()">←</button>

    <h2 style="margin-bottom:22px;">📊 Statistikalar</h2>

    <div class="stats-card">
        <h3>Jami zikrlar</h3>
        <p id="statsTotalAll">0</p>
    </div>

    <div class="stats-card">
        <h3>Eng koʻp aytilgan</h3>
        <p id="statsBest">-</p>
    </div>

</div>

<!-- FAVORITE PAGE -->

<div class="favorite-page hidden" id="favoritePage">

    <button class="back-btn" onclick="goHome()">←</button>

    <h2 style="margin-bottom:20px;">⭐ Favorite Zikrlar</h2>

    <div class="stats-card">
        <p>Hozircha favorite zikr yoʻq</p>
    </div>

</div>

<script>

/* ZIKRLAR */

let zikrlar = JSON.parse(localStorage.getItem("zikrlar")) || [

{
name:"Astagʻfirulloh",
translation:"Allohdan magʻfirat soʻrayman"
},

{
name:"Subhanalloh",
translation:"Alloh barcha nuqsonlardan pokdir"
},

{
name:"Alhamdulillah",
translation:"Barcha hamd Alloh uchundir"
},

{
name:"Allohu Akbar",
translation:"Alloh eng buyukdir"
},

{
name:"La ilaha illalloh",
translation:"Allohdan boshqa iloh yoʻq"
},

{
name:"La ilaha illallohu malikul Haqqul mubin",
translation:"Haqiqiy podshoh boʻlgan Allohdan boshqa iloh yoʻq"
},

{
name:"Hasbunallohu va ni’mal vakil",
translation:"Alloh bizga kifoya va u eng yaxshi vakildir"
},

{
name:"Subhanallohi va bihamdihi",
translation:"Alloh pokdir va hamd Unga xosdir"
},

{
name:"Subhanallohil azim",
translation:"Buyuk Alloh barcha nuqsonlardan pokdir"
}

];

const grid = document.getElementById("zikrGrid");

/* RENDER */

function renderZikrlar(){

    grid.innerHTML = "";

    zikrlar.forEach(item=>{

        const saved = JSON.parse(localStorage.getItem(item.name)) || {
            total:0,
            today:0,
            last:"-"
        };

        grid.innerHTML += `

        <div class="card" onclick="openZikr('${item.name}')">

            <div class="card-icon">📿</div>

            <h3>${item.name}</h3>

            <div class="translation">
                ${item.translation}
            </div>

            <p>${saved.total} marta aytilgan</p>

        </div>

        `;
    });

    updateTotalAll();
}

renderZikrlar();

/* MENU */

function openMenu(){

    document.getElementById("sidebar").classList.add("active");
    document.getElementById("overlay").classList.add("active");
}

function closeMenu(){

    document.getElementById("sidebar").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
}

/* OPEN PAGES */

function openAddPage(){

    hideAllPages();

    document.getElementById("addPage").classList.remove("hidden");

    closeMenu();
}

function openStatsPage(){

    hideAllPages();

    document.getElementById("statsPage").classList.remove("hidden");

    updateStatsPage();

    closeMenu();
}

function openFavoritePage(){

    hideAllPages();

    document.getElementById("favoritePage").classList.remove("hidden");

    closeMenu();
}

function hideAllPages(){

    document.getElementById("homePage").classList.add("hidden");
    document.getElementById("zikrPage").classList.add("hidden");
    document.getElementById("addPage").classList.add("hidden");
    document.getElementById("statsPage").classList.add("hidden");
    document.getElementById("favoritePage").classList.add("hidden");
}

/* SAVE NEW ZIKR */

function saveNewZikr(){

    let name = document.getElementById("newZikrName").value.trim();

    let translation = document.getElementById("newZikrTranslation").value.trim();

    if(name === "" || translation === "") return;

    zikrlar.push({
        name:name,
        translation:translation
    });

    localStorage.setItem("zikrlar",JSON.stringify(zikrlar));

    document.getElementById("newZikrName").value = "";
    document.getElementById("newZikrTranslation").value = "";

    goHome();

    renderZikrlar();
}

/* SEARCH */

function searchZikr(text){

    const cards = document.querySelectorAll(".card");

    cards.forEach(card=>{

        const title = card.innerText.toLowerCase();

        if(title.includes(text.toLowerCase())){

            card.style.display = "block";

        }else{

            card.style.display = "none";

        }

    });

}

/* OPEN ZIKR */

let currentZikr = "";

function openZikr(name){

    currentZikr = name;

    hideAllPages();

    document.getElementById("zikrPage").classList.remove("hidden");

    const zikr = zikrlar.find(z=>z.name === name);

    document.getElementById("pageTitle").innerText = zikr.name;

    document.getElementById("pageTranslation").innerText = zikr.translation;

    updateUI();
}

/* HOME */

function goHome(){

    hideAllPages();

    document.getElementById("homePage").classList.remove("hidden");

    renderZikrlar();
}

/* COUNTER */

function incrementZikr(){

    if(navigator.vibrate){

        navigator.vibrate(30);

    }

    let data = JSON.parse(localStorage.getItem(currentZikr)) || {
        total:0,
        today:0,
        last:"-"
    };

    data.total++;
    data.today++;

    const now = new Date();

    data.last =
        now.getHours().toString().padStart(2,'0')
        + ":" +
        now.getMinutes().toString().padStart(2,'0');

    localStorage.setItem(currentZikr,JSON.stringify(data));

    updateUI();
}

/* UPDATE */

function updateUI(){

    let data = JSON.parse(localStorage.getItem(currentZikr)) || {
        total:0,
        today:0,
        last:"-"
    };

    document.getElementById("counterText").innerText = data.total;

    document.getElementById("todayCount").innerText = data.today;

    document.getElementById("totalCount").innerText = data.total;

    document.getElementById("lastTime").innerText = data.last;

    let topName = "-";
    let topCount = 0;

    zikrlar.forEach(z=>{

        let d = JSON.parse(localStorage.getItem(z.name));

        if(d && d.total > topCount){

            topCount = d.total;

            topName = z.name;

        }

    });

    document.getElementById("bestZikr").innerText = topName;

    updateTotalAll();
}

/* TOTAL */

function updateTotalAll(){

    let total = 0;

    zikrlar.forEach(z=>{

        let d = JSON.parse(localStorage.getItem(z.name));

        if(d){

            total += d.total;

        }

    });

    document.getElementById("allTotal").innerText = total;
}

/* STATS PAGE */

function updateStatsPage(){

    let total = 0;

    let best = "-";

    let bestCount = 0;

    zikrlar.forEach(z=>{

        let d = JSON.parse(localStorage.getItem(z.name));

        if(d){

            total += d.total;

            if(d.total > bestCount){

                bestCount = d.total;

                best = z.name;

            }

        }

    });

    document.getElementById("statsTotalAll").innerText = total;

    document.getElementById("statsBest").innerText = best;
}

/* DARK MODE */

function toggleDarkMode(){

    if(document.body.style.background === "white"){

        document.body.style.background = "#081317";
        document.body.style.color = "white";

    }else{

        document.body.style.background = "white";
        document.body.style.color = "black";

    }

}

</script>

</body>
</html>
